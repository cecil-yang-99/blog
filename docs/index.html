<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cecil Blog</title>
    <link rel="icon" href="_media/favicon.ico" />
    <meta
      name="google-site-verification"
      content="6t0LoIeFksrjF4c9sqUEsVXiQNxLp2hgoqo0KryT-sE"
    />
    <meta
      name="keywords"
      content="doc,docs,documentation,gitbook,creator,generator,github,jekyll,github-pages"
    />
    <meta name="description" content="A magical documentation generator." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
      title="vue"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css"
      title="dark"
      disabled
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/buble.css"
      title="buble"
      disabled
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css"
      title="pure"
      disabled
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dolphin.css"
      title="dolphin"
      disabled
    />
    <style>
      :root {
        --cecil-accent: #2563eb;
        --cecil-accent-strong: #1d4ed8;
        --cecil-ink: #172033;
        --cecil-muted: #667085;
        --cecil-surface: #ffffff;
        --cecil-border: #e5e7eb;
        --cecil-code-bg: #f6f8fb;
      }

      html,
      body,
      .content,
      .markdown-section,
      .app-nav {
        background: #ffffff;
      }

      body {
        color: var(--cecil-ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: 0;
      }

      nav.app-nav li ul {
        min-width: 100px;
      }

      .app-name-link img {
        max-width: 48px;
        border-radius: 8px;
      }

      .sidebar {
        background: #fbfcfe;
        border-right: 1px solid var(--cecil-border);
      }

      .sidebar > h1 {
        font-size: 20px;
        font-weight: 750;
        letter-spacing: 0;
      }

      .sidebar ul li a {
        border-radius: 6px;
        color: #344054;
        font-size: 14px;
        line-height: 1.45;
        margin-right: 10px;
        padding: 6px 10px;
      }

      .sidebar ul li.active > a,
      .sidebar ul li a:hover {
        background: #eef4ff;
        color: var(--cecil-accent-strong);
        font-weight: 650;
      }

      .sidebar-toggle {
        border-radius: 6px;
      }

      .search input {
        border: 1px solid var(--cecil-border);
        border-radius: 8px;
        font-size: 14px;
        padding: 10px 12px;
      }

      .search input:focus {
        border-color: var(--cecil-accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      .markdown-section {
        max-width: 880px;
        padding: 42px 32px 64px;
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: var(--cecil-ink);
        font-weight: 750;
        letter-spacing: 0;
      }

      .markdown-section h1 {
        font-size: 40px;
        line-height: 1.14;
        margin-bottom: 20px;
      }

      .markdown-section h2 {
        border-bottom: 1px solid var(--cecil-border);
        font-size: 28px;
        line-height: 1.22;
        margin-top: 40px;
        padding-bottom: 10px;
      }

      .markdown-section p,
      .markdown-section li {
        color: #344054;
        font-size: 16px;
        line-height: 1.75;
      }

      .markdown-section a {
        color: var(--cecil-accent);
        font-weight: 600;
      }

      .markdown-section blockquote {
        background: #f8fafc;
        border-left: 4px solid var(--cecil-accent);
        border-radius: 0 8px 8px 0;
        color: #475467;
        margin: 22px 0;
        padding: 14px 18px;
      }

      .markdown-section pre,
      .markdown-section code {
        background: var(--cecil-code-bg);
        border-radius: 6px;
      }

      .markdown-section pre {
        border: 1px solid var(--cecil-border);
        padding: 18px;
      }

      .cover {
        background: linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.94),
            rgba(239, 246, 255, 0.9)
          ),
          url('_media/R.jpg') center / 320px no-repeat !important;
        color: var(--cecil-ink);
      }

      .cover-main {
        max-width: 860px;
        padding: 36px 24px;
        text-align: left;
      }

      .cover-main > p:first-child img {
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
        height: 96px;
        width: 96px;
      }

      .cover-main h1 {
        color: var(--cecil-ink);
        font-size: clamp(44px, 7vw, 76px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.98;
        margin: 22px 0 16px;
      }

      .cover-main h1 small {
        color: var(--cecil-accent);
        display: block;
        font-size: 0.28em;
        font-weight: 750;
        letter-spacing: 0;
        margin-top: 12px;
      }

      .cover-main blockquote {
        border-left: 4px solid var(--cecil-accent);
        color: #475467;
        font-size: 18px;
        line-height: 1.7;
        margin: 18px 0 30px;
        max-width: 600px;
        padding: 0 0 0 18px;
      }

      .cover-main .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .cover-main .buttons a {
        border: 1px solid var(--cecil-border);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--cecil-accent);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0;
        min-height: 44px;
        padding: 12px 18px;
        text-align: center;
      }

      .cover-main .buttons a:last-child {
        background: var(--cecil-accent);
        border-color: var(--cecil-accent);
        color: #ffffff;
      }

      .cover-main .buttons a:hover,
      .cover-main .buttons a:focus {
        border-color: var(--cecil-accent-strong);
        box-shadow: 0 10px 26px rgba(37, 99, 235, 0.2);
      }

      .app-nav a {
        color: #344054;
        font-weight: 650;
      }

      .app-nav a:hover {
        color: var(--cecil-accent);
      }

      .github-link {
        align-items: center;
        background: #ffffff;
        border: 1px solid var(--cecil-border);
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        color: var(--cecil-ink);
        display: inline-flex;
        font-size: 14px;
        font-weight: 700;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        position: fixed;
        right: 24px;
        text-decoration: none;
        top: 52px;
        z-index: 60;
      }

      .github-link:hover,
      .github-link:focus {
        border-color: var(--cecil-accent);
        color: var(--cecil-accent);
      }

      @media (max-width: 768px) {
        .markdown-section {
          padding: 28px 20px 48px;
        }

        .markdown-section h1 {
          font-size: 32px;
        }

        .markdown-section h2 {
          font-size: 24px;
        }

        .cover {
          background: linear-gradient(
              120deg,
              rgba(255, 255, 255, 0.96),
              rgba(239, 246, 255, 0.92)
            ),
            url('_media/R.jpg') right 16px bottom 24px / 190px no-repeat !important;
        }

        .cover-main {
          padding: 28px 20px;
        }

        .cover-main h1 {
          font-size: 44px;
        }

        .cover-main blockquote {
          font-size: 16px;
        }

        .cover-main .buttons {
          flex-direction: column;
          max-width: 280px;
        }

        .github-link {
          right: 14px;
          top: 14px;
        }
      }

      #carbonads {
        box-shadow: none !important;
        width: auto !important;
        display: none;
      }

      [id^='carbonads'] {
        display: none;
      }
    </style>
    <script>
      (function () {
        const lang = location.hash.match(/#\/(de-de|es|ru-ru|zh-cn)\//);

        // Set html "lang" attribute based on URL
        if (lang) {
          document.documentElement.setAttribute('lang', lang[1]);
        }
      })();
    </script>
  </head>

  <body>
    <a
      class="github-link"
      href="https://github.com/haozong99/blog"
      rel="noopener noreferrer"
      target="_blank"
    >
      GitHub
    </a>
    <div id="app">Loading ...</div>
    <script src="//cdn.jsdelivr.net/npm/docsify-plugin-carbon@1"></script>
    <script>
      // Docsify configuration
      window.$docsify = {
        skipLink: 'Cecil',
        alias: {
          '.*?/awesome':
            'https://raw.githubusercontent.com/docsifyjs/awesome-docsify/master/README.md',
          '.*?/changelog':
            'https://raw.githubusercontent.com/docsifyjs/docsify/master/CHANGELOG.md',
          '/.*/_navbar.md': '/_navbar.md',
          '/es/(.*)':
            'https://raw.githubusercontent.com/docsifyjs/docs-es/master/$1',
          '/de-de/(.*)':
            'https://raw.githubusercontent.com/docsifyjs/docs-de/master/$1',
          '/ru-ru/(.*)':
            'https://raw.githubusercontent.com/docsifyjs/docs-ru/master/$1',
          '/zh-cn/(.*)':
            'https://cdn.jsdelivr.net/gh/docsifyjs/docs-zh@master/$1',
        },
        auto2top: true,
        coverpage: false,
        executeScript: true,
        homepage: 'Fiber.md',
        loadSidebar: true,
        loadNavbar: true,
        mergeNavbar: false,
        maxLevel: 4,
        subMaxLevel: 2,
        ga: 'UA-106147152-1',
        matomo: {
          host: '//matomo.thunderwave.de',
          id: 6,
        },
        name: 'Cecil',
        nameLink: {
          '/es/': '#/es/',
          '/de-de/': '#/de-de/',
          '/ru-ru/': '#/ru-ru/',
          '/zh-cn/': '#/zh-cn/',
          '/': '#/',
        },
        search: {
          noData: {
            '/es/': '¡No hay resultados!',
            '/de-de/': 'Keine Ergebnisse!',
            '/ru-ru/': 'Никаких результатов!',
            '/zh-cn/': '没有结果!',
            '/': 'No results!',
          },
          paths: 'auto',
          placeholder: {
            '/es/': 'Buscar',
            '/de-de/': 'Suche',
            '/ru-ru/': 'Поиск',
            '/zh-cn/': '搜索',
            '/': 'Search',
          },
          pathNamespaces: ['/es', '/de-de', '/ru-ru', '/zh-cn'],
        },
        // skipLink: {
        //   '/es/': 'Saltar al contenido principal',
        //   '/de-de/': 'Ga naar de hoofdinhoud',
        //   '/ru-ru/': 'Перейти к основному содержанию',
        //   '/zh-cn/': '跳到主要内容',
        // },
        vueComponents: {
          'button-counter': {
            template: /* html */ `<button @click="count += 1">You clicked me {{ count }} times</button>`,
            data() {
              return {
                count: 0,
              };
            },
          },
        },
        vueGlobalOptions: {
          data() {
            return {
              count: 0,
              message: 'Hello, World!',
              // Fake API response
              images: [
                { title: 'Image 1', url: 'https://picsum.photos/150?random=1' },
                { title: 'Image 2', url: 'https://picsum.photos/150?random=2' },
                { title: 'Image 3', url: 'https://picsum.photos/150?random=3' },
              ],
            };
          },
          computed: {
            timeOfDay() {
              const date = new Date();
              const hours = date.getHours();

              if (hours < 12) {
                return 'morning';
              } else if (hours < 18) {
                return 'afternoon';
              } else {
                return 'evening';
              }
            },
          },
          methods: {
            hello() {
              alert(this.message);
            },
          },
        },
        vueMounts: {
          '#counter': {
            data() {
              return {
                count: 0,
              };
            },
          },
        },
        plugins: [
          DocsifyCarbon.create('CEBI6KQE', 'docsifyjsorg'),
          function (hook, vm) {
            hook.beforeEach(html => {
              if (/githubusercontent\.com/.test(vm.route.file)) {
                url = vm.route.file
                  .replace('raw.githubusercontent.com', 'github.com')
                  .replace(/\/master/, '/blob/master');
              } else if (/jsdelivr\.net/.test(vm.route.file)) {
                url = vm.route.file
                  .replace('cdn.jsdelivr.net/gh', 'github.com')
                  .replace('@master', '/blob/master');
              } else {
                url =
                  'https://github.com/docsifyjs/docsify/blob/develop/docs/' +
                  vm.route.file;
              }
              const editHtml = '';
              return editHtml + html + '\n\n----\n\n';
            });
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/front-matter.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/ga.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/matomo.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
    <!-- <script src="//cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script> -->
  </body>
</html>
